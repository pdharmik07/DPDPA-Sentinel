# Local PostgreSQL for DPDPA Sentinel.
#   docker compose up -d
# Matches the default DATABASE_URL in backend/.env.example.
services:
  postgres:
    image: postgres:16-alpine
    container_name: dpdpa-sentinel-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: dpdpa
      POSTGRES_PASSWORD: dpdpa
      POSTGRES_DB: dpdpa_sentinel
    ports:
      - '5432:5432'
    volumes:
      - dpdpa_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U dpdpa -d dpdpa_sentinel']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  dpdpa_pgdata:
